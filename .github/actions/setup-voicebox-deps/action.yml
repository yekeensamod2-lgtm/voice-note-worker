name: Prepare cached Voicebox CPU environment
description: Restore or build the pinned CPU-only Qwen/Voicebox Python environment.
runs:
  using: composite
  steps:
    - name: Checkout pinned Voicebox source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: jamiepine/voicebox
        ref: 7b570438da7565e849ec08b16a469339985eaf8c
        path: voicebox-src
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12.16'

    - name: Restore installed Python environment
      id: python-env-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          .venv
        key: voicebox-pyenv-${{ runner.os }}-ubuntu24-py3.12.16-cpu-v3-vbox-7b570438-qwen-022e286b-${{ hashFiles('voicebox-src/backend/requirements.txt', 'worker/requirements.txt') }}

    - name: Validate or create virtual environment
      id: python-env
      shell: bash
      run: |
        set -euo pipefail
        if [[ -x .venv/bin/python ]] && .venv/bin/python -c 'import fastapi, qwen_tts, requests, torch; assert torch.version.cuda is None and torch.version.hip is None' >/dev/null 2>&1; then
          echo 'cache_valid=true' >> "$GITHUB_OUTPUT"
        else
          rm -rf .venv
          python -m venv .venv
          echo 'cache_valid=false' >> "$GITHUB_OUTPUT"
        fi
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    - name: Install CPU-only Voicebox dependencies
      if: steps.python-env.outputs.cache_valid != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check \
          --index-url https://download.pytorch.org/whl/cpu \
          --extra-index-url https://pypi.org/simple \
          'torch==2.15.0+cpu' 'torchaudio==2.11.1+cpu'
        python -m pip install --disable-pip-version-check -r voicebox-src/backend/requirements.txt
        python -m pip install --disable-pip-version-check --no-deps \
          'git+https://github.com/QwenLM/Qwen3-TTS.git@022e286b98fbec7e1e916cb940cdf532cd9f488e'
        python -m pip install --disable-pip-version-check -r worker/requirements.txt
        python -m pip check
        python -c 'import torch; assert torch.version.cuda is None and torch.version.hip is None; print("CPU-only PyTorch environment ready")'

    - name: Ensure FFmpeg is available on the GitHub runner
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ffmpeg >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
        fi

    - name: Validate FFmpeg and Opus encoder
      shell: bash
      run: |
        set -euo pipefail
        command -v ffmpeg >/dev/null
        command -v ffprobe >/dev/null
        ffmpeg -hide_banner -encoders 2>/dev/null | grep -qE '^[[:space:]]*A[^[:space:]]*[[:space:]]+libopus[[:space:]]'

    - name: Save installed Python environment
      if: success() && steps.python-env.outputs.cache_valid != 'true' && steps.python-env-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          .venv
        key: voicebox-pyenv-${{ runner.os }}-ubuntu24-py3.12.16-cpu-v3-vbox-7b570438-qwen-022e286b-${{ hashFiles('voicebox-src/backend/requirements.txt', 'worker/requirements.txt') }}
