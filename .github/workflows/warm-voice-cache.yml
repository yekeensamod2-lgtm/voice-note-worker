name: Warm private voice worker dependency cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout worker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Build and cache Voicebox CPU environment
        uses: ./.github/actions/setup-voicebox-deps
